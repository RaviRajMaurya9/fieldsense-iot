services:
  - type: web
    name: fieldsense-iot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE_TOKEN
        value: FieldSenseSecretToken2026
      - key: FARMER_USERNAME
        value: farmer
      - key: FARMER_PASSWORD
        value: farm123
